# Baseline configuration. Every field maps 1:1 to vngat/config.py and can be
# overridden on the command line, e.g.
#   python -m scripts.train --config configs/default.yaml --num_layers 6

# ---- data ----
root_dir: data
data_subsets: everyday_compressed,artifact_compressed
input_source: frac         # pruned fracture surfaces only
fracture_pattern: fractured_
split_source: hash
val_frac: 0.1
test_frac: 0.1
split_seed: 0
max_scenes: 4000
correspondence: true
correspondence_tol: 1.0e-05
min_fragments: 2

# ---- model ----
hidden_channels: 64
num_layers: 4
num_vn_slots: 8
heads: 4
embed_dim: 32
gram_bottleneck: 16
norm: layer
grad_checkpointing: false

# ---- loss weights (all untuned at 1.0) ----
w_rot: 1.0
w_pos: 1.0
w_node: 1.0
w_mid: 1.0
w_face: 1.0
w_emb_v: 1.0
w_emb_e: 1.0
emb_pull_margin: 0.1
emb_push_margin: 0.5

# ---- optimisation ----
epochs: 400
batch_size: 2
micro_batch_scenes: 1
steps_per_epoch: 80
val_steps: 16
lr: 0.0003
weight_decay: 1.0e-05
grad_clip: 1.0
amp: false
lr_schedule: plateau
lr_monitor: rot
lr_patience: 20
lr_min: 1.0e-05
lr_warmup_epochs: 5
lr_factor: 0.5
seed: 0

# ---- dataloading ----
num_workers: 2
prefetch_factor: 4
pin_memory: true
persistent_workers: true

# ---- runtime ----
num_gpus: 2
device: cuda
master_port: 12355
time_budget_hours: 11.0

# ---- checkpointing ----
checkpoint_dir: /kaggle/working/checkpoints
save_every: 10
resume: auto
drive_folder_id: ''
drive_credentials: ''

log_every: 1
tag: vngat_frac
