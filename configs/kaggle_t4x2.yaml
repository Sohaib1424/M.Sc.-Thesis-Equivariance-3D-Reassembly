# Kaggle: 2x Tesla T4 (16 GB each, Turing -> fp16 yes, bf16 NO), ~4 CPU cores.
#
# The three settings that make this fit in 16 GB, in order of how much each
# buys:
#   data.decimate_to          caps vertices per scene -> caps peak memory
#   model.gradient_checkpointing  trades ~30% compute for ~4x less activation memory
#   train.amp (fp16)          halves every activation tensor
#
# accum_steps=4 with batch_size=2 gives an effective batch of 8 scenes per rank
# (16 across both GPUs) at the memory cost of 2.
#
# num_workers is deliberately low: with 2 ranks this is 2x2 = 4 worker
# processes on a ~4-core box, and scene loading is CPU-bound mesh work.
data:
  root_dir: /kaggle/input/breaking-bad-dataset
  input_source: full
  decimate_to: 6000
  max_vertices: 20000
  num_workers: 2
  # Preprocessing was measured at ~49% of epoch wall-clock. It is deterministic
  # given (scene, fracture, decimation settings), so it is cached to disk and
  # paid once. /kaggle/working persists across sessions of the same notebook.
  cache_dir: /kaggle/working/scene_cache
  # /kaggle/working has a 20 GB quota that ALSO holds your checkpoints. Entries
  # average ~437 KB, so an uncapped cache reaches the quota within the first
  # hour and then checkpoint saves start failing.
  # ONE budget shared by both caches, plus a free-space floor. /kaggle/working
  # is 20 GB total and also holds the repo, the checkpoints and (if you put it
  # there) the dataset. Caching stops while 4 GiB is still free, whatever
  # consumed the rest -- a full disk makes CHECKPOINT WRITES fail, which is the
  # one failure that costs a whole run.
  cache_max_gib: 6.0
  cache_min_free_gib: 4.0
  seed: 0

model:
  hidden_channels: 32
  num_layers: 3
  num_vn_slots: 8
  heads: 4
  embed_dim: 32
  norm: layer
  gradient_checkpointing: true

loss:
  rot_loss: chordal

optim:
  lr: 3.0e-4
  grad_clip: 5.0
  # An "epoch" is 150 steps, not a pass over the data, so plateau patience is
  # much more frequent than it looks. At the old patience of 5 the LR reached
  # 1e-7 by roughly epoch 100 of 3000 and training stopped moving.
  plateau_patience: 40
  min_lr: 1.0e-6

train:
  # Sized on NODES ALONE, batch 16 looks free -- 16x6,000 is about the same
  # node count as 4x22,500. It was not: stage-2 attention also scales with the
  # number of FRAGMENTS in the batch, and real scenes carry 30-59 of them.
  # Measured at batch 16: compute 2.95 s/batch against 0.83 at batch 4.
  #
  # Stage 2 now runs per scene rather than as one dense batch matrix, which
  # removes the quadratic term. Batch 8 is the conservative setting until you
  # have re-measured on your own card:
  #   python scripts/profile_memory.py --sweep --fragments 40
  batch_size: 8
  accum_steps: 2
  steps_per_epoch: 150
  val_steps: 30
  amp: true
  amp_dtype: fp16
  num_gpus: 2
  checkpoint_dir: /kaggle/working/checkpoints

  # A ~6-day run inside 12-hour sessions is about a dozen restarts.
  #   resume: auto           picks up last.pt by itself, so the SAME command
  #                          can be re-run every session with no editing
  #   time_budget_hours      stops cleanly rather than being killed mid-epoch;
  #                          11.5 leaves room for the final checkpoint write
  #   save_every: 1
  # Numbered generations on top of last.pt, oldest pruned. Cheap insurance:
  # each file is ~5 MB at 418k parameters.
  snapshot_every: 10
  keep_snapshots: 3          a killed session then costs at most one epoch
  resume: auto
  time_budget_hours: 11.5
  save_every: 1
  # Numbered generations on top of last.pt, oldest pruned. Cheap insurance:
  # each file is ~5 MB at 418k parameters.
  snapshot_every: 10
  keep_snapshots: 3
  epochs: 3000

  max_consecutive_oom: 5
