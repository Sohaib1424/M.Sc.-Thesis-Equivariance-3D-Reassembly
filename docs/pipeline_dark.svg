<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" role="img" aria-label="Pipeline: one scene is read once into fragments in their assembled frame; coincidence labels are computed there before any perturbation; the fragments then split into a ground-truth copy and a randomly perturbed copy that share one topology; only the perturbed copy is standardised and fed to the network, whose predicted rotation is applied to the centred non-standardised copy and compared against the ground truth." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/>
          </marker>
          <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
          </marker>
        </defs>
        <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#e6edf3">

          <rect x="240" y="14" width="220" height="42" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="350" y="32" text-anchor="middle">scene directory on disk</text>
          <text x="350" y="47" text-anchor="middle" font-size="10.5" fill="#9198a1">mesh · cell matrix · ~80 modes</text>
          <line x1="350" y1="56" x2="350" y2="86" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>

          <rect x="220" y="88" width="260" height="46" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="350" y="107" text-anchor="middle">SceneReader.load_mode</text>
          <text x="350" y="123" text-anchor="middle" font-size="10.5" fill="#9198a1">fragments, assembled frame · ~2 ms</text>

          <line x1="480" y1="111" x2="556" y2="111" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ara)"/>
          <rect x="558" y="88" width="132" height="46" rx="3" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
          <text x="624" y="107" text-anchor="middle" fill="#58a6ff" font-weight="600">coincidence</text>
          <text x="624" y="122" text-anchor="middle" fill="#58a6ff" font-size="10.5">labels</text>
          <text x="624" y="152" text-anchor="middle" fill="#58a6ff" font-size="10.5">computed HERE —</text>
          <text x="624" y="166" text-anchor="middle" fill="#58a6ff" font-size="10.5">before perturbation</text>

          <line x1="350" y1="134" x2="350" y2="152" stroke="#e6edf3" stroke-width="1.3"/>
          <line x1="150" y1="152" x2="470" y2="152" stroke="#e6edf3" stroke-width="1.3"/>
          <line x1="150" y1="152" x2="150" y2="182" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <line x1="470" y1="152" x2="470" y2="182" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <text x="350" y="146" text-anchor="middle" font-size="10.5" fill="#9198a1">one topology, two coordinate copies</text>

          <rect x="70" y="184" width="160" height="40" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="150" y="209" text-anchor="middle">ground truth</text>

          <rect x="390" y="184" width="160" height="40" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="470" y="203" text-anchor="middle">perturb SE(3)</text>
          <text x="470" y="217" text-anchor="middle" font-size="10.5" fill="#9198a1">per fragment</text>

          <line x1="150" y1="224" x2="150" y2="254" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <line x1="470" y1="224" x2="470" y2="254" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>

          <rect x="70" y="256" width="160" height="40" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="150" y="281" text-anchor="middle">centre per fragment</text>
          <rect x="390" y="256" width="160" height="40" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="470" y="281" text-anchor="middle">centre per fragment</text>

          <line x1="470" y1="296" x2="470" y2="326" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <rect x="390" y="328" width="160" height="44" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="470" y="347" text-anchor="middle">standardise</text>
          <text x="470" y="362" text-anchor="middle" font-size="10.5" fill="#9198a1">one scale per scene</text>

          <line x1="470" y1="372" x2="470" y2="402" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <rect x="380" y="404" width="180" height="44" rx="3" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
          <text x="470" y="423" text-anchor="middle" fill="#58a6ff" font-weight="600">VN-GAT</text>
          <text x="470" y="438" text-anchor="middle" fill="#58a6ff" font-size="10.5">→ R̂ per fragment</text>

          <line x1="380" y1="426" x2="240" y2="426" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <text x="310" y="418" text-anchor="middle" font-size="10.5" fill="#9198a1">apply R̂</text>

          <line x1="150" y1="296" x2="150" y2="466" stroke="#e6edf3" stroke-width="1.3"/>
          <rect x="70" y="404" width="160" height="44" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="150" y="423" text-anchor="middle">R̂ · centred copy</text>
          <text x="150" y="438" text-anchor="middle" font-size="10.5" fill="#9198a1">not standardised</text>

          <line x1="150" y1="466" x2="350" y2="466" stroke="#e6edf3" stroke-width="1.3"/>
          <line x1="350" y1="466" x2="350" y2="486" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#ar)"/>
          <rect x="240" y="488" width="220" height="36" rx="3" fill="none" stroke="#e6edf3" stroke-width="1.3"/>
          <text x="350" y="511" text-anchor="middle">losses vs ground truth</text>
        </g>
      </svg>