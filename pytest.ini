[pytest]
testpaths = tests
pythonpath = src .
addopts = -q --strict-markers

# `slow` marks the tests that actually train a model for a few seconds --
# `test_the_model_can_actually_learn` above all. They run by default because a
# suite that never checks the model can fit is a suite that would pass with a
# transposed rotation label. Skip them with `-m "not slow"` when iterating.
markers =
    slow: trains a model; seconds rather than milliseconds
filterwarnings =
    error::RuntimeWarning:reassembly.*
